<!DOCTYPE html>
<html lang="tr" class="octane-dark">
<head>
    <meta name="qweblox-viewer" data-id="1" data-name="Owner" data-displayname="Owner" data-staff="1">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Home - QweBlox</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #191b1d;
            --surface-color: #232527;
            --card-color: #393b3d;
            --border-color: #656668;
            --text-main: #ffffff;
            --text-sub: #bdbebe;
            --primary-accent: #00a2ff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Hanken Grotesk', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-sub);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        .rbx-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 50px;
            background-color: var(--surface-color);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 1000;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .qweblox-logo {
            font-weight: 900;
            font-size: 20px;
            color: var(--text-main);
            text-decoration: none;
            letter-spacing: 0.5px;
        }

        .qweblox-logo span {
            color: var(--primary-accent);
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 16px;
            list-style: none;
        }

        .nav-links a, .nav-btn {
            color: var(--text-main);
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            background: none;
            border: none;
            cursor: pointer;
        }

        .nav-btn:hover, .nav-links a:hover {
            color: var(--primary-accent);
        }

        .header-search {
            flex: 0 1 400px;
            margin: 0 20px;
        }

        .search-box {
            position: relative;
            width: 100%;
        }

        .search-box input {
            width: 100%;
            height: 32px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 4px;
            padding: 0 35px 0 12px;
            color: var(--text-main);
            font-size: 13px;
            outline: none;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .currency-stat {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            font-weight: 700;
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.05);
            padding: 4px 10px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .robux-icon {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid var(--primary-accent);
            border-radius: 2px;
            transform: rotate(45deg);
        }

        .admin-tag {
            background-color: #d12027;
            color: #fff;
            padding: 3px 8px;
            font-size: 11px;
            font-weight: 800;
            border-radius: 4px;
        }

        .qweblox-nav-offset {
            margin-top: 50px;
            padding: 25px 30px;
            flex: 1;
            max-width: 1200px;
            margin-left: auto;
            margin-right: auto;
            width: 100%;
        }

        .user-welcome-card {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 30px;
        }

        .user-welcome-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .avatar-thumb-box {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: #111;
            border: 2px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
        }

        .user-names h2 {
            color: var(--text-main);
            font-size: 22px;
            font-weight: 700;
        }

        .user-names p {
            font-size: 13px;
            color: var(--text-sub);
        }

        .section-title {
            color: var(--text-main);
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 16px;
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 16px;
            margin-bottom: 40px;
        }

        .game-card {
            background-color: var(--surface-color);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 6px;
            overflow: hidden;
            transition: transform 0.15s;
            text-decoration: none;
            color: inherit;
        }

        .game-card:hover {
            transform: translateY(-4px);
        }

        .game-thumb {
            width: 100%;
            aspect-ratio: 1/1;
            background-color: #111;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #777;
            font-weight: 600;
            text-align: center;
            padding: 10px;
        }

        .game-details {
            padding: 10px;
        }

        .game-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .game-creator {
            font-size: 11px;
            color: var(--text-sub);
            margin-top: 3px;
        }

        /* Modal (Create Pop-up) */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }

        .modal-content {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 24px;
            width: 100%;
            max-width: 450px;
        }

        .modal-content h3 {
            color: var(--text-main);
            margin-bottom: 16px;
        }

        .modal-content label {
            display: block;
            font-size: 13px;
            margin-bottom: 6px;
            color: var(--text-sub);
        }

        .modal-content input, .modal-content select {
            width: 100%;
            padding: 10px;
            margin-bottom: 16px;
            background: #111;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            color: #fff;
            outline: none;
        }

        .btn-group {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .btn-primary {
            background: var(--primary-accent);
            border: none;
            color: #fff;
            padding: 8px 16px;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-cancel {
            background: var(--card-color);
            border: none;
            color: #fff;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
        }

        footer {
            background: transparent;
            padding: 30px 0;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            font-size: 11px;
            color: #606162;
        }
    </style>
</head>
<body>

    <div id="header" class="rbx-header">
        <div class="header-left">
            <a class="qweblox-logo" href="/">Qwe<span>Blox</span></a>
            <ul class="nav-links">
                <li><a href="/">Discover</a></li>
                <li><a href="#">Avatar Shop</a></li>
                <li><button class="nav-btn" onclick="openCreateModal()">Create</button></li>
            </ul>
        </div>

        <div class="header-right">
            <div class="currency-stat">
                <span class="robux-icon"></span>
                <span>999,999,999</span>
            </div>
            <span class="admin-tag">OWNER</span>
        </div>
    </div>

    <main class="qweblox-nav-offset">
        <div class="user-welcome-card">
            <div class="user-welcome-info">
                <div class="avatar-thumb-box">👤</div>
                <div class="user-names">
                    <h2>Owner <span style="font-size: 16px; color: var(--primary-accent);">✓</span></h2>
                    <p>@admin &bull; QweBlox Kurucusu</p>
                </div>
            </div>
            <div>
                <button class="btn-primary" onclick="openCreateModal()">+ Yeni Oyun Oluştur</button>
            </div>
        </div>

        <div class="section-title">
            <span>Discover Games</span>
        </div>

        <div class="games-grid" id="gamesContainer">
            <!-- Oyunlar API'den dinamik olarak buraya gelecek -->
        </div>
    </main>

    <!-- Create Game Modal Penceresi -->
    <div class="modal" id="createModal">
        <div class="modal-content">
            <h3>QweBlox - Yeni Oyun / Harita Yükle</h3>
            <form action="/api/create-game" method="POST">
                <label>Oyun Başlığı:</label>
                <input type="text" name="title" placeholder="Örn: Sword Fight on the Heights" required>

                <label>Geliştirici / Sahip:</label>
                <input type="text" name="creator" value="Owner" readonly>

                <label>Harita Dosyası (.rbxl):</label>
                <input type="file" accept=".rbxl" style="padding: 6px;">

                <div class="btn-group">
                    <button type="button" class="btn-cancel" onclick="closeCreateModal()">İptal</button>
                    <button type="submit" class="btn-primary">Yayınla</button>
                </div>
            </form>
        </div>
    </div>

    <footer>
        <p>© 2026 QweBlox. Not affiliated with the Roblox Corporation.</p>
    </footer>

    <script>
        function openCreateModal() {
            document.getElementById('createModal').style.display = 'flex';
        }

        function closeCreateModal() {
            document.getElementById('createModal').style.display = 'none';
        }

        // Oyunları API'den çekip listeleme
        async function loadGames() {
            try {
                const res = await fetch('/api/games');
                const games = await res.json();
                const container = document.getElementById('gamesContainer');
                container.innerHTML = '';

                games.forEach(game => {
                    const card = document.createElement('div');
                    card.className = 'game-card';
                    card.innerHTML = `
                        <div class="game-thumb">${game.thumb}</div>
                        <div class="game-details">
                            <div class="game-title">${game.title}</div>
                            <div class="game-creator">by ${game.creator}</div>
                        </div>
                    `;
                    container.appendChild(card);
                });
            } catch (err) {
                console.error("Oyunlar yüklenirken hata:", err);
            }
        }

        loadGames();
    </script>
</body>
</html>
